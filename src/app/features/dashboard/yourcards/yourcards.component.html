<div class="hed">
  <div class="ph6">
    <p class="YC">Your cards</p>
    <a routerLink="/accounts" class="All">ALL ACCOUNTS</a>
  </div>

  <div class="cardscontainer">
    <div class="firstDiv">
      <div class="card" *ngFor="let card of cards">
        <div class="card-body d-flex first">
          <div class="imgdiv d-flex">
            <div>
              <img
                *ngIf="isVisa(card)"
                src="assets/img/Icons-Visa.png"
                alt="Visa"
              />
              <img
                *ngIf="!isVisa(card)"
                src="assets/img/Icons-Master Card.png"
                alt="Mastercard"
              />
            </div>
            <div>
              <h6>{{ card.card | creditcard }}</h6>
              <p>Card number</p>
            </div>
          </div>
          <div class="two">
            <h6>{{ card.amount | currency : "USD" : "symbol" : "1.2-2" }}</h6>
            <p>Balance</p>
          </div>
          <div class="three">
            <h6>{{ isBlocked(card) ? "Blocked" : "Active" }}</h6>
            <p>Status</p>
          </div>
          <div>
            <i class="far fa-question-circle icon"></i>
          </div>
        </div>
      </div>

      <div class="card" *ngIf="!loading && cards.length === 0">
        <div class="card-body d-flex first">
          <div class="imgdiv d-flex">
            <div>
              <p class="mb-0">
                You don't have any cards yet.
                <a routerLink="/accounts/create-card">Add your first card</a>.
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
